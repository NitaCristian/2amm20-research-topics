mainClassName = 'be.kuleuven.scd.Main'
run {
    systemProperties 'logback.configurationFile': 'logback.xml'
}

test {
    systemProperties 'logback.configurationFile': 'logback-test.xml'
}

task makeOriginal(type: Exec) {
    inputs.files 'cmd_line.cc', 'cmd_line.h', 'cmd_option.h', 'Losses.h', 'scd.cc'
    outputs.files 'cmd_line.o', 'scd.o', 'scd'

    workingDir 'SCD'
    commandLine '/usr/bin/make'
}

task cleanOriginal(type: Exec) {
    workingDir 'SCD'
    commandLine '/usr/bin/make', 'clean'
}
